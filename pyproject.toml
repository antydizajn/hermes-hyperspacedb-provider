[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-hyperspacedb-provider"
version = "2.5.0"
description = "Fail-closed HyperspaceDB MemoryProvider for Hermes Agent"
requires-python = ">=3.11"
dependencies = ["hyperspacedb>=3.1.3,<4"]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-timeout>=2.3"]

[tool.setuptools.package-dir]
hermes_hyperspacedb_provider = "."

[tool.setuptools.package-data]
hermes_hyperspacedb_provider = ["plugin.yaml"]

[tool.setuptools.exclude-package-data]
hermes_hyperspacedb_provider = ["tests*", "_deferred_events*", "*.sqlite3*", "state*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
python_files = ["test_*.py"]
norecursedirs = ["state*", ".git", "build", "dist", "*.egg-info"]

[tool.ruff]
line-length = 100
target-version = "py311"
