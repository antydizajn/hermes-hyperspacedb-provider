name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Checkout pinned Hermes Agent
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: 56a41715dc3b8bf6f50a740ff9416c4036ef4259
          path: .ci/hermes-agent

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test deps
        run: python -m pip install --upgrade pip && pip install pytest pyyaml

      - name: Install plugin into bundled Hermes memory path
        run: |
          mkdir -p .ci/hermes-agent/plugins/memory/hyperspacedb
          rsync -a --exclude .git --exclude .github --exclude .ci ./ .ci/hermes-agent/plugins/memory/hyperspacedb/

      - name: Unit and contract tests
        env:
          PYTHONPATH: ${{ github.workspace }}/.ci/hermes-agent
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q tests --ignore=tests/run_test_collection_e2e.py -p no:cacheprovider

  packaging:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: python -m pip install --upgrade pip && pip install build wheel setuptools

      - name: Build wheel and sdist
        run: python -m build

      - name: Test wheel installation and package imports
        run: |
          python -m pip install dist/*.whl
          python -c "import hermes_hyperspacedb_provider as p; assert hasattr(p, 'HyperspaceDBMemoryProvider')"
          python -c "from hermes_hyperspacedb_provider import register, HyperspaceDBMemoryProvider"

      - name: Verify wheel purity
        run: |
          python - <<'PY'
          import glob, zipfile
          for w in glob.glob("dist/*.whl"):
              with zipfile.ZipFile(w) as z:
                  names = z.namelist()
                  assert not any("/tests/" in x or x.startswith("tests/") for x in names), f"Found tests in {w}"
                  assert not any("/_deferred_events/" in x or x.startswith("_deferred_events/") for x in names), f"Found deferred in {w}"
          print("Wheel purity verified: zero test files or deferred events packaged.")
          PY

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-packages
          path: dist/
          if-no-files-found: error

  user-install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Checkout pinned Hermes Agent
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: 56a41715dc3b8bf6f50a740ff9416c4036ef4259
          path: .ci/hermes-agent

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install discovery deps
        run: python -m pip install --upgrade pip && pip install pyyaml

      - name: User-install discovery smoke
        env:
          PYTHONPATH: ${{ github.workspace }}/.ci/hermes-agent
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: |
          test ! -e .ci/hermes-agent/plugins/memory/hyperspacedb
          mkdir -p "$HERMES_HOME/plugins/hyperspacedb"
          rsync -a --exclude .git --exclude .github --exclude .ci ./ "$HERMES_HOME/plugins/hyperspacedb/"
          python - <<'PY'
          import os
          from pathlib import Path
          from plugins.memory import find_provider_dir, _is_memory_provider_dir
          home = Path(os.environ["HERMES_HOME"])
          user = (home / "plugins" / "hyperspacedb").resolve()
          assert _is_memory_provider_dir(user)
          found = find_provider_dir("hyperspacedb")
          print("found", found)
          assert found is not None
          assert found.resolve() == user
          PY

  sdk-import:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        constraint: ["hyperspacedb==3.1.3", "hyperspacedb>=3.1.3,<4"]
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Checkout pinned Hermes Agent
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: 56a41715dc3b8bf6f50a740ff9416c4036ef4259
          path: .ci/hermes-agent

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install real HyperspaceDB SDK constraint
        run: python -m pip install --upgrade pip && pip install "${{ matrix.constraint }}" cryptography pytest pyyaml

      - name: Install plugin into bundled Hermes memory path
        run: |
          mkdir -p .ci/hermes-agent/plugins/memory/hyperspacedb
          rsync -a --exclude .git --exclude .github --exclude .ci ./ .ci/hermes-agent/plugins/memory/hyperspacedb/

      - name: Real SDK import verification
        env:
          PYTHONPATH: ${{ github.workspace }}/.ci/hermes-agent
          HSDB_REQUIRE_REAL_SDK: "1"
        run: python -m pytest -q tests/test_sdk_import_contract.py -p no:cacheprovider

  hermes-canary:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Checkout latest Hermes Agent (main canary)
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: main
          path: .ci/hermes-agent

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test deps
        run: python -m pip install --upgrade pip && pip install pytest pyyaml

      - name: Install plugin into bundled Hermes memory path
        run: |
          mkdir -p .ci/hermes-agent/plugins/memory/hyperspacedb
          rsync -a --exclude .git --exclude .github --exclude .ci ./ .ci/hermes-agent/plugins/memory/hyperspacedb/

      - name: Upstream canary unit and contract tests
        env:
          PYTHONPATH: ${{ github.workspace }}/.ci/hermes-agent
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q tests --ignore=tests/run_test_collection_e2e.py -p no:cacheprovider

  release:
    runs-on: ubuntu-latest
    needs: [test, packaging, user-install, sdk-import, hermes-canary]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-packages
          path: dist

      - name: Generate SHA256 Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          echo "=== ARTIFACT CHECKSUMS ==="
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG_NAME" dist/* \
            --title "$TAG_NAME: Verified Release" \
            --generate-notes \
            --latest || gh release upload "$TAG_NAME" dist/* --clobber
